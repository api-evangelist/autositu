name: Autositu
description: >-
  Autositu (AutoSitu) is a Y Combinator (Winter 2026) PropTech startup building an
  AI-native intelligence layer for real estate development plan review. Its multi-agent
  platform automatically analyzes site plans, building plans, and AEC drawings against
  municipal zoning and building codes to flag compliance issues before submission,
  cutting city comments and resubmittals so approvals move faster. The product serves
  cities, architecture and engineering firms, and real estate developers with
  human-in-the-loop review workflows. Autositu is an early-stage SaaS company and does
  not currently publish a public developer API, SDKs, or developer documentation; this
  profile is maintained in the API Evangelist network as an enrichment lead.
